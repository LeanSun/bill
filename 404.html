<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轻账 · 收支看板</title>
<script>
/* 纯静态托管没有服务端重写：/bill/calendar 这种路径式深链会落到 404。
   这里把它折回 hash 路由，用户看到的是同一页，地址栏也就此改正。 */
(function () {
  var segs = location.pathname.split('/').filter(Boolean);
  var base = segs.length ? '/' + segs[0] : '';
  var rest = segs.slice(1).join('/').replace(/\.html$/i, '').split('/')[0].toLowerCase();
  var map = {
    '': 'home', home: 'home', overview: 'overview', index: 'home',
    calendar: 'calendar', week: 'calendar', month: 'calendar', year: 'calendar',
    analysis: 'analysis', stats: 'analysis', trend: 'analysis'
  };
  location.replace(base + '/#/' + (map[rest] || 'home'));
})();
</script>
</head>
<body></body>
</html>
